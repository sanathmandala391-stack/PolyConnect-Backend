name: PolyConnect Attendance Automation

on:
  schedule:
    # Runs at 6:00 AM IST daily (00:30 UTC)
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  attendance-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Fetch Attendance and Send Emails via Gmail
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          GMAIL_USER: ${{ secrets.MAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: node .github/scripts/send-attendance-emails.js
