#Production
spring:
  application:
    name: POLYCONNECT
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:polyconnect-1-v-sanathmandala391-0388.g.aivencloud.com}:${DB_PORT:17090}/${DB_NAME:defaultdb}?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${DB_USER:avnadmin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtps
    properties:
      mail:
        transport:
          protocol: smtps
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          connectiontimeout: 7000
          timeout: 7000
          writetimeout: 7000
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

polyconnect:
  mail:
    from: ${MAIL_FROM:sanathmandala391@gmail.com}
    brevo-api-key: ${BREVO_API_KEY:}
    resend-api-key: ${RESEND_API_KEY:}

  automation:
    secret: ${AUTOMATION_SECRET}

  security:
    jwt:
      secret: ${JWT_SECRET:PolyConnectLocalDevSecret_2026_SBTET_JWT_9fK3mP7xQ2vL8nR5tY6wA1zB4cD}
      expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://b64a-2409-40f0-6402-6754-cce6-9cdd-9d51-8c33.ngrok-free.app,https://0829-2409-40f0-6424-cfbb-a013-21f6-51ab-e26c.ngrok-free.app,https://polyconnect-two.vercel.app}
  sbtet:
    base-url: https://www.sbtet.telangana.gov.in/api/api
    sync-cron: "0 0 6 * * ?" # Run daily at 2:00 AM
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-3.6-flash
