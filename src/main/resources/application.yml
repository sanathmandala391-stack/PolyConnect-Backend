#Production
spring:
  application:
    name: POLYCONNECT
  datasource:
    url: jdbc:mysql://${DB_HOST:polyconnect-1-v-sanathmandala391-0388.g.aivencloud.com}:${DB_PORT:17090}/${DB_NAME:defaultdb}?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:avnadmin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

polyconnect:
  security:
    jwt:
      # No default on purpose — JWT_SECRET must be set explicitly (openssl rand -hex 64).
      # The app fails to start if it is missing, rather than silently signing tokens
      # with a value anyone reading this file could forge.
      secret: ${JWT_SECRET:PolyConnectLocalDevSecret_2026_SBTET_JWT_9fK3mP7xQ2vL8nR5tY6wA1zB4cD}
      expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://b64a-2409-40f0-6402-6754-cce6-9cdd-9d51-8c33.ngrok-free.app,https://0829-2409-40f0-6424-cfbb-a013-21f6-51ab-e26c.ngrok-free.app,https://polyconnect-two.vercel.app}
  sbtet:
    base-url: https://www.sbtet.telangana.gov.in/api/api
    sync-cron: "0 0 6 * * ?" # Run daily at 2:00 AM
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-3.6-flash